name: Build Android APK (Azota Quiz)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Cài đặt Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Chấp nhận Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 5. Cài đặt Dependencies
        run: npm install

      - name: 6. Chuẩn bị thư mục web (www) cho Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          cp style.css www/
          cp -r js www/
          cp -r lib www/

      - name: 7. Khởi tạo Android Project bằng Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: 8. Thay icon app bằng icon custom
        run: |
          # Cài ImageMagick để resize icon
          sudo apt-get install -y imagemagick > /dev/null 2>&1
          # Tạo icon các kích thước cho Android
          for size_dir in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $size_dir
            dir="android/app/src/main/res/mipmap-$1"
            mkdir -p "$dir"
            convert resources/icon.jpg -resize ${2}x${2} "$dir/ic_launcher.png"
            convert resources/icon.jpg -resize ${2}x${2} "$dir/ic_launcher_round.png"
            convert resources/icon.jpg -resize ${2}x${2} "$dir/ic_launcher_foreground.png"
          done
          echo "✅ Icon app đã được thay thế ở tất cả kích thước!"

      - name: 9. Cấp quyền thực thi cho Gradle
        run: chmod +x android/gradlew

      - name: 10. Biên dịch mã nguồn thành file APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 11. Tải file APK lên GitHub Artifacts để người dùng tải về
        uses: actions/upload-artifact@v4
        with:
          name: AzotaQuiz-LiquidGlass-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
